<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Asesoría jurídica cercana, rigurosa y transparente con la Licda. Azucely Loayes, Abogada y Notaria." />
    <meta name="theme-color" content="#173F46" />
    <title>Licda. Azucely Loayes | Abogada y Notaria</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('legal-administrator-theme')
          if (theme === 'dark') document.documentElement.dataset.theme = 'dark'
          else document.documentElement.dataset.theme = 'light'
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
