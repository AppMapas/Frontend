services:
  frontend:
    build:
      context: ./legal_administrator_frontend
      dockerfile: Dockerfile
      target: dev
    container_name: legal_administrator_frontend
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./legal_administrator_frontend:/app
      - /app/node_modules
