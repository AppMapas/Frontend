name: Deploy frontend to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'LegalAdministrator' }}
      BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME || 'legal-backend' }}
      FRONTEND_SERVICE_NAME: ${{ vars.FRONTEND_SERVICE_NAME || 'legal-frontend' }}
      ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      ECS_INFRASTRUCTURE_ROLE_ARN: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
      ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
      FRONTEND_SECURITY_GROUP_IDS: ${{ vars.FRONTEND_SECURITY_GROUP_IDS }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate local configuration and helper
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_deployment.py frontend
          python3 .github/scripts/test_deploy_ecs.py
          python3 .github/scripts/test_automation.py
          test -f legal_administrator_frontend/Dockerfile
          test -f legal_administrator_frontend/nginx.conf

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install current AWS CLI and validate ECR
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade awscli
          aws ecr describe-repositories --repository-names legal-frontend >/dev/null
          aws ecs create-cluster --cluster-name "$ECS_CLUSTER" >/dev/null

      - name: Get backend URL from ECS
        id: backend
        run: python3 .github/scripts/deploy_ecs.py backend-url

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push SPA image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/legal-frontend:$GITHUB_SHA"
          docker build --target prod --build-arg "VITE_API_URL=$BACKEND_URL/api/v1" \
            -t "$image" legal_administrator_frontend
          docker push "$image"
          echo "IMAGE_URI=$image" >> "$GITHUB_ENV"

      - name: Deploy frontend to ECS Express Mode
        id: deploy
        run: python3 .github/scripts/deploy_ecs.py frontend

      - name: Update backend CORS
        env:
          FRONTEND_URL: ${{ steps.deploy.outputs.url }}
        run: python3 .github/scripts/deploy_ecs.py cors

      - name: Verify frontend and CORS
        env:
          FRONTEND_URL: ${{ steps.deploy.outputs.url }}
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: python3 .github/scripts/verify_runtime.py cors

      - name: Deployment summary
        env:
          FRONTEND_URL: ${{ steps.deploy.outputs.url }}
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          printf '## Frontend deployed\n\nFrontend: %s\n\nAPI: %s/api/v1\n' \
            "$FRONTEND_URL" "$BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
